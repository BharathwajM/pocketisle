# Builds and tests Pocket Isle on Windows for every push and pull request, and keeps the built
# pocketisle.exe as a download (Actions → Build → the run → Artifacts). Pushing a tag such as
# v0.2.0 also publishes a GitHub Release with pocketisle.exe attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Keep pocketisle.exe
        uses: actions/upload-artifact@v4
        with:
          name: pocketisle-windows-x64
          path: |
            target/release/pocketisle.exe
            install.ps1
            uninstall.ps1

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/pocketisle.exe
            install.ps1
            uninstall.ps1
          generate_release_notes: true
